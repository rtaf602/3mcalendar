<style>
/* Layout: toolbar band over a printed-sheet replica (always paper white, like the Excel original), one grid per month */
:root{
  --bg:#EEF1F5; --fg:#16202E; --muted:#5B6878; --line:#C9D1DB; --panel:#FFFFFF; --accent:#1F4E8C; --accent-fg:#FFFFFF; --danger:#C62828; --soft:#F4F6F9; --accent-soft:#E3ECF8; --ok:#1E7A46;

  --f-ui:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11161D;--fg:#E4E9EF;--muted:#98A3B1;--line:#2A333F;--panel:#18202A;--accent:#7FA8E0;--accent-fg:#0D1520;--danger:#FF6B6B;--soft:#1F2833;--accent-soft:#22324A;--ok:#5BC98A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161D;--fg:#E4E9EF;--muted:#98A3B1;--line:#2A333F;--panel:#18202A;--accent:#7FA8E0;--accent-fg:#0D1520;--danger:#FF6B6B;--soft:#1F2833;--accent-soft:#22324A;--ok:#5BC98A;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.bar h1{font-size:16px;font-weight:600;margin:0;margin-right:auto;text-wrap:balance}
.range{display:flex;align-items:center;gap:4px;font-weight:500}
.range span{min-width:13em;text-align:center;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 11px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.icon{padding:6px 9px}
button.danger{color:var(--danger);border-color:var(--danger)}
button:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:12.5px}
.saving{font-size:12.5px;color:var(--muted);min-width:6em}

.sheetScroll{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.sheet{min-width:1520px;background:var(--paper);color:var(--ink);font-family:var(--f-sheet);padding:10px 10px 14px}
.title{text-align:center;font-weight:700;font-size:calc(16pt*var(--fs));line-height:1.25;padding:2px 0 8px}
.title .sub{display:block}
.title input{font:inherit;text-align:center;border:1px dashed var(--grid);background:transparent;color:inherit;width:16em}

.month{display:grid;grid-template-columns:114px var(--gut,0px) repeat(31,minmax(44px,1fr));grid-auto-rows:minmax(calc(20pt*var(--fs)*1.33),auto);border:2px solid #000;margin-bottom:10px;position:relative}
.editing .month{--gut:30px}
.cell{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);min-width:0}
.cell.lc,.ev.lc,.dh.lc{border-right:0}
.cell.lr,.ev.lr,.mlabel.lr,.gut.lr{border-bottom:0}
.cell.void{background:var(--void);border-right-color:#000;border-bottom-color:#000}
.cell.off.free{background:var(--off)}
.editing .dh:not(.void){cursor:pointer}
.editing .dh:not(.void):hover{outline:2px solid #1F4E8C;outline-offset:-2px}
.editing .cell.free:not(.void){cursor:copy}
.editing .cell.free:not(.void):hover{background:rgba(31,78,140,.08)}
.dh{background:var(--dayHead);font-weight:700;text-align:center;font-size:calc(12pt*var(--fs)*1.333);display:flex;align-items:center;justify-content:center;border-right:2px solid #000;border-bottom:2px solid #000}
.dh.today{box-shadow:inset 0 -3px 0 #C00000}
.mlabel{background:var(--monthHead);font-weight:700;font-size:calc(16pt*var(--fs)*1.333);padding:2px 3px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;border-right:2px solid #000;border-bottom:2px solid #000}
.mlabel span{white-space:nowrap}
.gut{display:none;align-items:center;justify-content:center;border-right:1px solid #BFC5CC;border-bottom:1px solid #BFC5CC;background:#F6F7F9}
.editing .gut{display:flex}
.gut button{font-family:var(--f-ui);font-size:14px;line-height:1;padding:2px 4px;border:0;background:transparent;color:#5B6878;opacity:.35;border-radius:4px}
.gut:hover button,.gut button:focus-visible,.gut button.open{opacity:1;background:#E4E8EE}
.ev{position:relative;z-index:2;font-size:var(--evfs,16px);margin:0;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;line-height:1.05;padding:1px 3px;overflow:hidden;min-width:0;cursor:pointer;word-break:normal;overflow-wrap:normal}
.ev:not(.sel):hover{outline:2px solid #1F4E8C;outline-offset:-2px;z-index:4}
.ev .tx{max-width:100%;outline:none}
.ev .tx[contenteditable="true"]{background:#fff;color:#000;box-shadow:0 0 0 2px #1F4E8C;border-radius:2px;padding:0 3px;cursor:text;user-select:text;-webkit-user-select:text;white-space:pre-wrap;min-width:2em}
.editing{user-select:none;-webkit-user-select:none}
.editing .ev{cursor:grab;touch-action:pan-x pan-y;-webkit-touch-callout:none}
.editing .cell:not(.void){cursor:cell}
.cell.csel{box-shadow:inset 0 0 0 2px #1F4E8C;background-color:rgba(31,78,140,.08)}
.ev.sel{outline:2.5px solid #1F4E8C;outline-offset:-2px;z-index:6;overflow:visible}
.ev.dragging{opacity:.8;outline:2px dashed #1F4E8C;z-index:6;cursor:grabbing}
.ev.lifted{transform:scale(1.04);box-shadow:0 8px 22px rgba(0,0,0,.35);z-index:8;transition:transform .12s,box-shadow .12s}
.ev.pressing::after{content:"";position:absolute;inset:0;background:rgba(31,78,140,.18);animation:press .45s linear forwards;transform-origin:left;pointer-events:none}
@keyframes press{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hdl{position:absolute;display:none;z-index:7;background:#fff;border:2px solid #1F4E8C;border-radius:3px;touch-action:none}
.ev.sel .hdl{display:block}
.hdl.l,.hdl.r{top:50%;width:9px;height:22px;margin-top:-11px;cursor:ew-resize}
.hdl.l{left:-5px}.hdl.r{right:-5px}
.hdl.t,.hdl.b{left:50%;width:22px;height:9px;margin-left:-11px;cursor:ns-resize}
.hdl.t{top:-5px}.hdl.b{bottom:-5px}
@media (pointer:coarse){.hdl.l,.hdl.r{width:16px;height:30px;margin-top:-15px}.hdl.t,.hdl.b{width:30px;height:16px;margin-left:-15px}.gut button{min-height:28px;opacity:.7}}
.past{background:rgba(255,0,0,.30);pointer-events:none;z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:calc(12pt*var(--fs)*1.333);padding:6px 2px 4px}
.legend b{margin-right:6px}
.sw{display:inline-flex;align-items:center;gap:6px}
.sw i{display:inline-block;width:42px;height:16px;border:1px solid #000}
.notes{font-size:calc(12pt*var(--fs)*1.333);padding:6px 0 0;display:grid;grid-template-columns:max-content minmax(0,1fr);row-gap:0}
.notes .nlab,.notes .ntxt{padding:3px 4px;min-height:1.5em;display:flex;align-items:center}
.notes .ntxt{display:block}
.notes .nlab{white-space:nowrap;padding-right:14px}
.notes .nl{grid-column:1/-1;display:grid;grid-template-columns:minmax(9em,15em) auto minmax(0,46em) auto auto;justify-content:start;gap:6px;align-items:center;padding:2px 0}
.notes input[type=text]{font:inherit;border:1px dashed var(--grid);background:transparent;padding:1px 4px;min-width:0}
.notes .nl input{width:100%;box-sizing:border-box}
.notes .nl{min-width:0}
.notes .nadd{grid-column:1/-1;padding-top:4px}
.notes .nl button{font-family:var(--f-ui);font-size:11px;padding:2px 6px}
.exportHost{position:absolute;left:-40000px;top:0}
.tools{display:flex;flex-wrap:wrap;gap:6px}
[hidden]{display:none!important}
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lockbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:min(340px,100%);display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.lockmark{color:var(--accent);display:flex;justify-content:center}
.lockbox h2{margin:0;font-size:18px;font-weight:600}

.lockbox .lbl{text-align:left;font-size:12.5px;color:var(--muted);margin:4px 0 -4px}

.lockerr{min-height:1.2em;color:var(--danger);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.people{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--muted)}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:3px 10px 3px 6px}
.pchip i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.sheet{position:relative}

.lockbar{background:#E8F0FB;color:#173A6B;border:1px solid #9DB8E0;border-radius:8px;padding:9px 12px;font-size:13.5px}
.lockbar.mine{background:#E7F4EA;color:#1D4D2B;border-color:#9CCBA8}
.expbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#FFF4D6;color:#5A3B00;border:1px solid #E8B64C;border-radius:8px;padding:9px 12px;font-size:13.5px}
.expbar span{flex:1;min-width:14em}
.who{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--muted)}

.logs{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.lg time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lg .by{font-weight:600}

.lg .act{grid-column:2}
.lg .det{grid-column:2;color:var(--muted);word-break:break-word}
.lastby{font-size:12.5px;color:var(--muted)}
.tools button{font-weight:600;letter-spacing:.02em;font-size:12.5px}

.pv{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.6);display:flex;flex-direction:column}

.pvbar h2{margin:0 auto 0 0;font-size:15px;font-weight:600}
.pvbar select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.pvbody{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.paper{background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.35);position:relative;flex:none}
.paper img{position:absolute;display:block;max-width:none}
.pvinfo{color:#E8EDF3;font-size:12.5px;text-align:center;padding:0 16px 6px}
.snaps{display:flex;flex-direction:column;gap:6px}
.snap{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 9px}

.empty{padding:28px;text-align:center;font-family:var(--f-ui);color:#555}

/* editor */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:50;display:flex;justify-content:flex-end}
.panel{background:var(--panel);color:var(--fg);width:min(420px,100%);height:100%;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 24px rgba(0,0,0,.2)}

.seg{display:flex;flex-wrap:wrap;gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{width:28px;height:26px;border-radius:5px;border:1px solid var(--line);padding:0;cursor:pointer;box-sizing:border-box}

.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel>h2{order:-2}
.panel>.acts{order:-1;position:sticky;top:-18px;z-index:3;background:var(--panel);margin:-6px 0 0;padding:8px 0 10px;border-bottom:1px solid var(--line)}
.acts .sp{flex:1}
.ro{font-size:13px;color:var(--muted)}

/* ribbon: tools change with the mode; per-mission tools need a selected mission */
.appbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.appbar h1{margin:0 auto 0 0;font-size:16px;font-weight:600;text-wrap:balance}
.ico{width:16px;height:16px;flex:none}
.ribbon button,.dock button,.pop button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.25}
.ribbon button.on,.dock button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover:not(:disabled){background:var(--soft)}
button.danger.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.ribbon button.danger,.dock button.danger{border-color:transparent}
kbd{font-family:var(--f-ui);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--soft);color:var(--muted)}
.ribbon{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ribbon.edit{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rbar{display:flex;align-items:stretch}

.tbtn{padding:5px 8px;min-width:32px;justify-content:center}

.namebar label{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;padding-top:7px;color:var(--fg)}
.namebar textarea{flex:1;min-width:0;resize:none;font-family:var(--f-sheet);font-size:20px;line-height:1.25;border:1.5px solid var(--accent);border-radius:7px;padding:5px 10px;background:var(--panel);color:var(--fg);min-height:38px;max-height:110px;overflow:auto}
.namebar textarea:disabled{border-color:var(--line);background:var(--soft);cursor:default}
.namebar textarea::placeholder{color:var(--muted);font-family:var(--f-ui);font-size:13.5px}
.namebar .nhint{font-size:11.5px;color:var(--muted);padding-top:9px;white-space:nowrap}
.namebar.flash textarea{animation:nflash .6s ease-out}
@keyframes nflash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:700px){.namebar{flex-wrap:wrap}.namebar .nhint{display:none}.namebar textarea{flex-basis:100%}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--panel);border-top:2px solid var(--accent);box-shadow:0 -8px 24px rgba(0,0,0,.16);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.dock .namebar{border-top:0;background:transparent;padding:0}
.dock .namebar .nhint{display:none}
.dockrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.dockrow .lbl{font-size:12.5px;color:var(--muted)}
.dockrow .sp{flex:1}
.dockrow .dhint{font-size:13.5px;color:var(--muted);flex:1;min-width:14em}
.statusline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border-top:1px solid var(--line);padding:6px 12px;font-size:12.5px;color:var(--muted)}
.statusline .saved{color:var(--ok);font-weight:500}
.statusline .err{color:var(--danger);font-weight:500}
.statusline .sp{flex:1}
.pop{position:fixed;z-index:70;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:180px;max-width:min(320px,calc(100vw - 32px))}
.pop .mi{display:flex;width:100%;border:0;background:transparent;border-radius:6px;padding:7px 10px;text-align:left;justify-content:flex-start;gap:10px}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--soft)}
.pop .mi.sel{background:var(--accent-soft)}
.pop .mi small{margin-left:auto;color:var(--muted)}
.pop .sep{height:1px;background:var(--line);margin:4px 2px}
.pal{display:grid;grid-template-columns:repeat(6,28px);gap:6px;padding:6px}
.pal button{width:28px;height:28px;padding:0;border-radius:6px;border:1px solid var(--line)}
.pal button.sel{outline:2px solid var(--accent);outline-offset:2px}
.pophead{font-size:12px;color:var(--muted);padding:4px 8px 2px}
.ulsample{display:inline-block;min-width:6.5em;font-family:var(--f-sheet);font-size:18px}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:8px 10px;font-size:13px;align-items:center}
.toast{display:flex;align-items:center;gap:12px}
.toast button{background:transparent;color:inherit;border-color:currentColor;padding:4px 12px;min-height:34px}
@media (pointer:coarse){.ribbon button,.dock button{min-height:40px}.tbtn{min-width:40px}.numbox{min-height:40px}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pin .12s ease-out}@keyframes pin{from{opacity:0;transform:translateY(-4px)}}}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .16s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

<script src="config.js"></script>
<script>
try{if(navigator.maxTouchPoints>1||'ontouchstart' in window)document.documentElement.classList.add('touch')}catch(_){}
(function(){
const TYPES={
  domestic:{label:'ภารกิจภายในประเทศ',fill:'#E2F0DB'},
  a32x:{label:'A319/A320',fill:'#B4C6E7'},
  a340:{label:'A340',fill:'#F5B084'},
  ssj:{label:'SSJ',fill:'#FFFF00'},
  maint:{label:'แผนซ่อมบำรุง / บ.ไม่ FMC',fill:'#FF0000',text:'#FFFFFF'},
  repair:{label:'บ.เข้าตรวจซ่อมอื่นๆ',fill:'#FF0000'},
  other:{label:'อื่นๆ (กำหนดสีพื้นเอง)',fill:'#FFFFFF'}
};
const LEGEND=['domestic','a32x','a340','ssj','maint','repair'];
const STATUS={normal:'ปกติ',pending:'รอยืนยัน',cancelled:'ยกเลิก'};
const TEXT_SW=['#000000','#FFFFFF','#FF0000','#0070C0','#00B050','#7030A0','#C65911'];
const FILL_SW=['#B24FFF','#FBE5D6','#FFC000','#FFFFFF','#DBDBDB','#FFFF00','#E2F0DB','#B4C6E7','#F5B084','#FF0000'];
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH='๐๑๒๓๔๕๖๗๘๙';
const thd=n=>String(n).replace(/\d/g,d=>TH[d]);
const pad=n=>String(n).padStart(2,'0');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TEXT_PAL=['#000000','#FFFFFF','#FF0000','#C00000','#0070C0','#1F4E8C','#00B050','#7030A0','#C65911','#7F7F7F','#FFC000','#FFFF00'];
const FILL_PAL=['#E2F0DB','#B4C6E7','#F5B084','#FFFF00','#FF0000','#B24FFF','#FBE5D6','#FFC000','#DBDBDB','#FFFFFF','#C6E0B4','#BDD7EE'];
const IC={
  undo:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3 2 6l3 3"/><path d="M2 6h7a4 4 0 0 1 0 8H6"/></svg>',
  redo:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m11 3 3 3-3 3"/><path d="M14 6H7a4 4 0 0 0 0 8h3"/></svg>',
  plus:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
  rows:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="4" rx="1"/><rect x="2" y="9.5" width="12" height="4" rx="1"/></svg>',
  trash:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>',
  pen:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 13l1-3.5L10.5 3 13 5.5 6.5 12z"/></svg>',
  check:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8.5 3 3 7-7"/></svg>',
  caret:'<svg class="ico" style="width:10px;height:10px" viewBox="0 0 10 10" fill="currentColor"><path d="M1.5 3.5h7L5 7.5z"/></svg>',
  dots:'<svg class="ico" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>',
  eye:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>',
  out:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M5 7l3 3 3-3M3 12.5h10"/></svg>',
  key:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="4" width="13" height="8" rx="1.5"/><path d="M4 7h1M7 7h1M10 7h2M5 9.5h6"/></svg>',
  fill:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 9 8 4l5 5-5 4.5z"/></svg>'
};

// font: TH SarabunPSK if installed, else Sarabun scaled to the same visual size
function hasFont_unused(n){try{const c=document.createElement('canvas').getContext('2d');const s='ภารกิจแผนซ่อมบำรุง 905 บน.41';c.font='40px monospace';const a=c.measureText(s).width;c.font='40px "'+n+'",monospace';return c.measureText(s).width!==a}catch(e){return false}}
// TH SarabunPSK is embedded in the page (all four styles), so sizes match the Excel original 1:1
document.documentElement.style.setProperty('--fs',1);

let REC='';try{REC=localStorage.getItem('mp_name')||''}catch(e){}
// ---------- server: Google Apps Script web app (URL in config.js) ----------
const CONF=window.MP_CONFIG||{};
const TAB='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); // this open tab
let TOKEN='',TOKEN_EXP=0;
try{const t=JSON.parse(localStorage.getItem('mp_tok')||'null');if(t&&t.exp>Date.now()){TOKEN=t.token;TOKEN_EXP=t.exp}}catch(e){}
async function api(action,payload){
  if(!CONF.apiUrl)throw {code:'no_api',message:'ยังไม่ได้ตั้งค่า apiUrl ในไฟล์ config.js'};
  let res,j;
  try{res=await fetch(CONF.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:TOKEN,tab:TAB},payload||{}))})}
  catch(e){throw {code:'network',message:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต'}}
  try{j=await res.json()}catch(e){throw {code:'network',message:'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง'}}
  if(j&&j.error){if(j.error.code==='auth')setTimeout(onAuthLost,0);throw j.error}
  return j;
}
// writes from one burst of actions go to the server as one batch
let Q=[],Qp=null;
function enqueue(op){Q.push(op);if(!Qp)Qp=new Promise(r=>setTimeout(r,40)).then(flushQ);return Qp}
async function flushQ(){const ops=Q;Q=[];Qp=null;if(!ops.length)return;const r=await api('write',{ops});if(r&&r.ver)S.ver=r.ver;scheduleRender();return r}
let renderT=0;function scheduleRender(){clearTimeout(renderT);renderT=setTimeout(()=>{api('render').catch(()=>{})},3000)}
function blobToB64(b){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]||'');fr.onerror=no;fr.readAsDataURL(b)})}
async function loadState(){
  const r=await api('load');const o={};Object.values(r.state.events||{}).forEach(e=>{o[e.id]=e});
  S.events=o;S.months=r.state.months||{};S.settings=Object.assign({unit:'แผนภารกิจ',notes:[]},r.state.settings||{});
  const had=lockMine();S.lockDoc=r.lock;S.ver=r.ver;S.db=true;S.loaded=true;
  if(had&&!lockMine()&&S.editing){S.editing=false;toast('สิทธิ์แก้ไขหมดอายุ ต้องกดโหมดแก้ไขใหม่',5000)}
  if(!drag)render();if(draft)updPreview();
}
function onAuthLost(){TOKEN='';TOKEN_EXP=0;try{localStorage.removeItem('mp_tok')}catch(e){}S.editing=false;draft=null;drawEditor();showLock(true);const e=$('lockErr');if(e)e.textContent='หมดเวลาใช้งาน กรุณาใส่รหัสใหม่'}
const S={events:{},months:{},settings:null,offset:0,editing:false,canWrite:false,db:null,loaded:false,armed:null,pending:0};
// edit mode always starts off: editing needs the one-at-a-time edit lock

function today(){const d=new Date();return{y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()}}
function mkey(y,m){return y+'-'+pad(m)}
function windowMonths(){const t=today();const out=[];for(let i=0;i<3;i++){let mm=t.m-1+S.offset+i;const y=t.y+Math.floor(mm/12);mm=((mm%12)+12)%12;out.push({y,m:mm+1,key:mkey(y,mm+1),days:new Date(y,mm+1,0).getDate()})}return out}
function evsOf(k){return Object.values(S.events).filter(e=>e.month===k)}
function lanesOf(k){const m=S.months[k];let need=0;evsOf(k).forEach(e=>need=Math.max(need,e.lane+(e.rows||1)));return Math.max(m&&m.lanes?m.lanes:6,need,1)}
function textColor(e){if(e.status==='cancelled')return'#FF0000';if(e.color)return e.color;return (TYPES[e.type]||TYPES.other).text||'#000000'}
function fillColor(e){if(e.fill)return e.fill;return (TYPES[e.type]||TYPES.other).fill}
function label(e){return e.text+(e.status==='cancelled'?' (ยกเลิก)':e.status==='pending'?' (รอยืนยัน)':'')}
function fsz(e){return 'calc('+(e.size||12)+'pt*var(--fs)*1.333)'}

function setSaving(d){S.pending+=d;if(d<0&&S.pending<=0&&!S._err&&isEd())UI.savedAt=new Date();$('saving').textContent=S.pending>0?'กำลังบันทึก…':(S._err?S._err:'');const sv=$('svState');if(sv)sv.outerHTML=svHTML()}
async function w(fn){setSaving(1);S._err='';try{await fn()}catch(e){
  if(e&&e.code==='not_lock_holder'){S._err='ไม่ได้ถือสิทธิ์แก้ไข';S.editing=false;S.lockDoc=null;toast('สิทธิ์แก้ไขหมดแล้ว อาจมีผู้อื่นกำลังแก้ไข โหลดข้อมูลล่าสุดให้แล้ว',6000)}
  else if(e&&e.code==='auth'){S._err=''}
  else{S._err='บันทึกไม่สำเร็จ';toast('บันทึกไม่สำเร็จ: '+((e&&e.message)||'')+' · โหลดข้อมูลล่าสุดให้แล้ว',6000)}
  loadState().catch(()=>{});
}finally{setSaving(-1)}}
async function putEvent(id,data){S.events[id]=Object.assign({id},data);render();await w(()=>enqueue({c:'events',op:'set',id,data:stripId(data)}))}
function stripId(e){const o=Object.assign({},e);delete o.id;return o}
async function patchMany(list){
  list.forEach(p=>S.events[p.id]=Object.assign({},S.events[p.id],p.data));render();
  if(list.length)await w(()=>Promise.all(list.map(p=>enqueue({c:'events',op:'update',id:p.id,data:p.data}))));
}
async function delEvent(id){delete S.events[id];render();await w(()=>enqueue({c:'events',op:'delete',id}))}
async function setLanes(k,n){S.months[k]=Object.assign({},S.months[k],{lanes:n});render();await w(()=>enqueue({c:'months',op:'set',id:k,data:{lanes:n}}))}
async function saveSettings(patch){S.settings=Object.assign({},S.settings,patch);render();await w(()=>enqueue({c:'meta',op:'set',id:'settings',data:S.settings}))}

// ---------- one editor at a time ----------
// locks/edit holds {holder, by, uid, until}. Claiming goes through a short db lease so two people cannot claim at once.
const LOCK_TTL=90e3,IDLE_MS=10*60e3;
let lastAct=Date.now();['pointerdown','keydown','wheel'].forEach(t=>document.addEventListener(t,()=>{lastAct=Date.now()},{passive:true,capture:true}));
function lockMine(){const L=S.lockDoc;return !!(L&&L.tab===TAB&&L.until>Date.now())}
function lockOther(){const L=S.lockDoc;return (L&&L.tab&&L.tab!==TAB&&L.until>Date.now())?L:null}
function canEdit(){return S.canWrite&&lockMine()}
async function getLock(){
  if(!S.db||!S.canWrite)return false;if(lockMine())return true;
  try{const r=await api('lock',{mode:'acquire'});S.lockDoc=r.lock;render();return !!r.ok}catch(e){return false}
}
async function releaseLock(){if(!lockMine())return;S.lockDoc=null;render();try{await api('lock',{mode:'release'})}catch(e){}}
function needsLock(){return S.editing||!!draft||!!NF||S._busy}
function maybeRelease(){setTimeout(()=>{if(lockMine()&&!needsLock())releaseLock()},0)}
async function withLock(fn){ // for one-off actions (SAVE, undo, restore) outside edit mode
  if(!(await getLock())){lockBusyToast();return}
  S._busy=true;try{await fn()}finally{S._busy=false;maybeRelease()}
}
function lockBusyToast(){const o=lockOther();toast(o?(o.by||'ผู้ใช้อื่น')+' กำลังแก้ไขอยู่ ดูได้อย่างเดียวจนกว่าจะแก้เสร็จ':'เริ่มแก้ไขไม่ได้ ลองใหม่อีกครั้ง',4500)}
setInterval(async()=>{ // keep the lock alive while working; give it up when idle
  if(!lockMine())return;
  if(Date.now()-lastAct>IDLE_MS&&!draft&&!NF){S.editing=false;await releaseLock();toast('ไม่มีการใช้งาน 10 นาที ออกจากโหมดแก้ไขแล้ว ผู้อื่นแก้ไขต่อได้',6000);return}
  if(!needsLock()){releaseLock();return}
  try{const r=await api('lock',{mode:'renew'});S.lockDoc=r.lock;if(!r.ok&&S.editing){S.editing=false;toast('สิทธิ์แก้ไขหมดอายุ ต้องกดโหมดแก้ไขใหม่',5000)}render()}catch(e){}

function snapState(){return JSON.stringify({events:S.events,months:S.months,settings:S.settings})}
function restoreLocal(j){const o=JSON.parse(j);S.events=o.events;S.months=o.months;S.settings=o.settings}
function setLanesLocal(k,n){S.months[k]=Object.assign({},S.months[k],{lanes:Math.max(1,Math.min(60,n))})}
function newId(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const bare=e=>JSON.stringify(Object.assign({},e,{ts:0,by:''}));
// compare the plan with an earlier copy, send only what changed, and log it
function syncFrom(prevJ,action,opt){
  const P=JSON.parse(prevJ),ops=[],det=[],now=Date.now();
  Object.keys(S.events).forEach(id=>{const e=S.events[id],o=P.events[id];
    if(o&&bare(o)===bare(e))return;
    e.ts=now;e.by=REC;ops.push({c:'events',op:'set',id,data:stripId(e)});
    if(o){const df=diffText(o,e);det.push(evName(o)+(df?' · '+df:''))}else det.push('เพิ่ม: '+evName(e));
  });
  Object.keys(P.events).forEach(id=>{if(!S.events[id]){ops.push({c:'events',op:'delete',id});det.push('ลบ: '+evName(P.events[id]))}});
  const mk=new Set(Object.keys(S.months).concat(Object.keys(P.months||{})));
  mk.forEach(k=>{const a=(S.months[k]&&S.months[k].lanes)||6,b=((P.months||{})[k]&&P.months[k].lanes)||6;if(a!==b||(!!S.months[k])!==(!!(P.months||{})[k]))ops.push({c:'months',op:'set',id:k,data:{lanes:a}})});
  if(JSON.stringify(S.settings)!==JSON.stringify(P.settings)){ops.push({c:'meta',op:'set',id:'settings',data:S.settings});
    const ha=(P.settings&&P.settings.holidays)||[],hb=(S.settings&&S.settings.holidays)||[];
    hb.filter(x=>ha.indexOf(x)<0).forEach(x=>det.push('วันหยุด +'+x));ha.filter(x=>hb.indexOf(x)<0).forEach(x=>det.push('วันหยุด −'+x));}
  if(!ops.length)return false;
  logEv(action,opt&&opt.detail!=null?opt.detail:det.join(' | '));
  w(()=>Promise.all(ops.map(enqueue)));
  return true;
}
function commit(action,fn,opt){
  opt=opt||{};

  const before=snapState();fn();
  const changed=syncFrom(before,action,opt);
  if(changed){
    const top=undoStack[undoStack.length-1];
    if(!(opt.merge&&top&&top.fresh===opt.merge)){undoStack.push({s:before,label:action,sel:UI.sel,fresh:opt.fresh||null});if(undoStack.length>100)undoStack.shift()}

// shrink month names until they fit their column
function fitLabels(root){
  root.querySelectorAll('.mlabel').forEach(l=>{
    const max=l.clientWidth-6;let px=parseFloat(getComputedStyle(l).fontSize),guard=0;
    l.style.fontSize='';px=parseFloat(getComputedStyle(l).fontSize);
    while(guard++<30&&[...l.querySelectorAll('span')].some(sp=>sp.scrollWidth>max)){px-=1;l.style.fontSize=px+'px'}
  });
  // mission text that is wider than its cells shrinks (down to 65%) instead of being cut off
  root.querySelectorAll('.ev').forEach(e=>{
    e.style.fontSize='';const base=parseFloat(getComputedStyle(e).fontSize);let px=base,guard=0;
    while(guard++<20&&e.scrollWidth>e.clientWidth+1&&px>base*0.65){px-=0.5;e.style.fontSize=px+'px'}
  });
}

const ULS=[['','ไม่มี'],['single','เส้นเดียว'],['double','เส้นคู่'],['singleAccounting','เส้นเดียว (บัญชี)'],['doubleAccounting','เส้นคู่ (บัญชี)']];
function ulCSS(u){if(!u)return '';return 'text-decoration-line:underline;text-decoration-style:'+(/double/.test(u)?'double':'solid')+';text-underline-offset:'+(/Accounting/.test(u)?'0.2em':'0.06em')+';text-decoration-thickness:'+(/Accounting/.test(u)?'1.5px':'1px')+';'}

function noteFmt(n,part){const base={size:n.size||12,color:n.color||'',bg:n.bg||'',bold:!!n.bold,italic:!!n.italic,underline:n.underline||''};return Object.assign(base,n[part==='l'?'lf':'tf']||{})}

function richHTML(t){return richRuns(t).map(r=>r.b?'<b>'+esc(r.t)+'</b>':esc(r.t)).join('')}
function isWeekend(M,d){const g=new Date(M.y,M.m-1,d).getDay();return g===0||g===6}
function isHol(M,d){const hs=(S.settings&&S.settings.holidays)||[];return hs.indexOf(M.y+'-'+pad(M.m)+'-'+pad(d))>=0}

function monthHTML(M,t){
  const k=M.key,n=lanesOf(k),ed=isEd();
  const occ=Array.from({length:n},()=>new Array(32).fill(false));
  const evs=evsOf(k).sort((a,b)=>a.lane-b.lane||a.start-b.start);
  evs.forEach(e=>{for(let r=e.lane;r<e.lane+(e.rows||1)&&r<n;r++)for(let d=e.start;d<=Math.min(e.end,31);d++)occ[r][d]=true});
  let h='<div class="month" data-month="'+k+'">';
  h+='<div class="mlabel" style="grid-column:1;grid-row:1">เดือน</div><div class="gut" style="grid-column:2;grid-row:1"></div>';
  for(let d=1;d<=31;d++){const isT=(M.y===t.y&&M.m===t.m&&d===t.d),v=d>M.days,hol=!v&&isHol(M,d);h+='<div class="dh'+(d===31?' lc':'')+(isT?' today':'')+(v?' void':'')+(hol?' hol':'')+'" data-hk="'+k+'" data-hd="'+d+'" title="'+(v?'':hol?'วันหยุดเพิ่มเติม':isWeekend(M,d)?'เสาร์-อาทิตย์':'')+'" style="grid-column:'+(2+d)+';grid-row:1'+(v?';background:var(--void);color:#000':'')+'">'+thd(d)+'</div>'}
  h+='<div class="mlabel lr" style="grid-column:1;grid-row:2/span '+n+'"><span>'+MONTHS[M.m-1]+'</span><span>'+thd(String(M.y+543).slice(-2))+'</span>'+'</div>';
  for(let L=0;L<n;L++){
    h+='<div class="gut'+(L===n-1?' lr':'')+'" style="grid-column:2;grid-row:'+(L+2)+'">'+(ed?'<button data-rowmenu="'+k+':'+L+'" aria-label="จัดการแถวที่ '+(L+1)+'" aria-haspopup="menu" title="แทรก/ลบแถว">⋮</button>':'')+'</div>';
    for(let d=1;d<=31;d++){h+='<div class="cell'+(d===31?' lc':'')+(L===n-1?' lr':'')+(d>M.days?' void':(isOff(M,d)?' off':''))+(occ[L][d]?'':' free')+(ed&&UI.cell&&UI.cell.k===k&&UI.cell.l===L&&UI.cell.d===d?' csel':'')+'" data-k="'+k+'" data-l="'+L+'" data-d="'+d+'" style="grid-column:'+(2+d)+';grid-row:'+(L+2)+'"></div>'}
  }
  evs.forEach(e=>{
    const s=Math.max(1,e.start),en=Math.min(Math.max(e.end,s),31),r=Math.min(e.rows||1,n-e.lane);
    h+='<div class="ev'+(en===31?' lc':'')+(e.lane+Math.max(1,r)>=n?' lr':'')+(ed&&UI.sel===e.id?' sel':'')+'" data-id="'+esc(e.id)+'" title="'+esc(label(e))+'" style="grid-column:'+(2+s)+'/span '+(en-s+1)+';grid-row:'+(e.lane+2)+'/span '+Math.max(1,r)+';background:'+fillColor(e)+';color:'+textColor(e)+';--evfs:'+fsz(e)+';font-weight:'+(e.bold||e.status==='cancelled'?700:400)+';'+fmtCSS(e)+'">'+(ed?'<span class="tx">'+esc(label(e))+'</span><span class="hdl l" data-h="l" title="ลากเพื่อเปลี่ยนวันเริ่ม"></span><span class="hdl r" data-h="r" title="ลากเพื่อเปลี่ยนวันสิ้นสุด"></span><span class="hdl t" data-h="t" title="ลากเพื่อเปลี่ยนแถวบน"></span><span class="hdl b" data-h="b" title="ลากเพื่อเปลี่ยนความสูง"></span>':esc(label(e)))+'</div>';
  });

  h+='</div>';return h;
}

    '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
    '_rels/.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="MASTER PLAN" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm.Print_Area" localSheetId="0">\'MASTER PLAN\'!$A$1:$AF$'+last+'</definedName></definedNames></workbook>',
    'xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
    'xl/styles.xml':styles,
    'xl/worksheets/sheet1.xml':sheet
  };
  return zipStore(files);
}
// minimal ZIP writer (stored entries)
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  for(const [name,txt] of Object.entries(files)){
    const nb=enc.encode(name),data=enc.encode(txt),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+data.length;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22)),n=Object.keys(files).length;
  end.setUint32(0,0x06054b50,true);end.setUint16(8,n,true);end.setUint16(10,n,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ---------- PREVIEW ----------
let PV=null;
async function openPreview(){
  PV={busy:true};drawPV();
  try{PV.c=await renderSheetCanvas();PV.url=PV.c.canvas.toDataURL('image/png')}catch(e){PV.err='จัดหน้าไม่สำเร็จ'}
  PV.busy=false;drawPV();
}
function drawPV(){
  let m=document.getElementById('pvm');
  if(!PV){if(m)m.remove();return}
  if(!m){m=document.createElement('div');m.id='pvm';document.body.appendChild(m)}
  const P=paperMM();
  let h='<div class="pv" role="dialog" aria-modal="true" aria-labelledby="pvT"><div class="pvbar"><h2 id="pvT">PREVIEW · 1 หน้า</h2>';
  h+='<label class="hint" for="pvSize">กระดาษ</label><select id="pvSize">'+Object.keys(PAPERS).map(s=>'<option'+(PAPER.size===s?' selected':'')+'>'+s+'</option>').join('')+'</select>';
  h+='<select id="pvOrient" aria-label="แนวกระดาษ"><option value="landscape"'+(PAPER.orient==='landscape'?' selected':'')+'>แนวนอน</option><option value="portrait"'+(PAPER.orient==='portrait'?' selected':'')+'>แนวตั้ง</option></select>';
  h+='<button id="pvXls">EXPORT TO EXCEL</button><button id="pvPdf" class="primary">EXPORT TO PDF</button><button id="pvClose">ปิด</button></div>';
  if(PV.busy)h+='<div class="pvbody"><div class="pvinfo">กำลังจัดหน้ากระดาษ…</div></div>';
  else if(PV.err)h+='<div class="pvbody"><div class="pvinfo">'+PV.err+'</div></div>';
  else{
    const vw=Math.max(280,window.innerWidth-40),vh=Math.max(240,window.innerHeight-150);
    const s=Math.min(vw/P.w,vh/P.h),sc=Math.min((P.w-2*P.m)/PV.c.cssW,(P.h-2*P.m)/PV.c.cssH);
    const iw=PV.c.cssW*sc,ih=PV.c.cssH*sc;
    h+='<div class="pvinfo">'+PAPER.size+' '+(PAPER.orient==='landscape'?'แนวนอน':'แนวตั้ง')+' · พอดี 1 หน้า</div>';
    h+='<div class="pvbody"><div class="paper" style="width:'+(P.w*s).toFixed(1)+'px;height:'+(P.h*s).toFixed(1)+'px"><img alt="ตัวอย่างหน้ากระดาษ" src="'+PV.url+'" style="left:'+(((P.w-iw)/2)*s).toFixed(1)+'px;top:'+(P.m*s).toFixed(1)+'px;width:'+(iw*s).toFixed(1)+'px;height:'+(ih*s).toFixed(1)+'px"></div></div>';
  }
  h+='</div>';m.innerHTML=h;
  const setP=()=>{PAPER={size:$('pvSize').value,orient:$('pvOrient').value};try{localStorage.setItem('mp_paper',JSON.stringify(PAPER))}catch(e){}openPreview()};
  $('pvSize').onchange=setP;$('pvOrient').onchange=setP;
  $('pvClose').onclick=()=>{PV=null;drawPV()};
  $('pvPdf').onclick=()=>exportPDF(PV&&PV.c);
  $('pvXls').onclick=()=>exportXLS();
}
window.addEventListener('resize',()=>{if(PV&&!PV.busy)drawPV()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&PV){PV=null;drawPV()}});
let busyX=false;
async function exportPDF(c){if(busyX)return;busyX=true;toast('กำลังสร้าง PDF…',20000);try{c=c||await renderSheetCanvas();const b=await buildPDF(c);await offer(fileBase()+'.pdf',b)}catch(e){toast('สร้าง PDF ไม่สำเร็จ')}finally{busyX=false}}
async function exportXLS(){if(busyX)return;busyX=true;try{const b=buildXLSX();await offer(fileBase()+'.xlsx',b)}catch(e){toast('สร้างไฟล์ Excel ไม่สำเร็จ')}finally{busyX=false}}

// ---------- SAVE (keeps a dated copy you can restore) ----------
async function doSave(){
  if(!S.db||!S.canWrite)return;if(!REC){needName(doSave);return}
  if(!lockMine()){return withLock(doSave)}
  if(Q.length||Qp){try{await (Qp||flushQ())}catch(e){}}
  const t=today(),iso=t.y+'-'+pad(t.m)+'-'+pad(t.d),lbl=pad(t.d)+'_'+pad(t.m)+'_'+String(t.y+543).slice(-2);
  S.settings=Object.assign({},S.settings,{updated:iso});
  toast('กำลังออกฉบับและเก็บไฟล์ Excel ลง Backup…',30000);setSaving(1);
  try{
    let b64='';try{b64=await blobToB64(buildXLSX())}catch(e){}
    const r=await api('save',{label:lbl,iso,xlsx:b64,filename:fileBase()});
    S.lastSnap=Object.assign({since:r.snap.at},r.snap);S.dirty=false;renderUndo();
    toast('ปิดงานแล้ว · ออกฉบับ Update '+lbl+(r.backup?' · เก็บ Excel ใน Backup แล้ว':''),5000);
    scheduleRender();await loadState();
  }catch(e){toast('ออกฉบับไม่สำเร็จ: '+((e&&e.message)||''),6000);loadState().catch(()=>{})}
  finally{setSaving(-1)}
}
async function pruneSnaps(){}
let SN=null;
async function openSnaps(){SN={busy:true,list:[]};drawSnaps();try{const r=await api('listSnaps',{limit:20});SN.list=r.list||[]}catch(e){SN.err='โหลดรายการไม่สำเร็จ'}SN.busy=false;drawSnaps()}
function drawSnaps(){
  const m=$('modal');if(!SN){m.innerHTML='';return}
  let h='<div class="scrim" id="snScrim"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="snT"><h2 id="snT">ฉบับที่บันทึก</h2><div class="hint">กด ปิดงาน / ออกฉบับ เพื่อเก็บฉบับใหม่ ระบบเก็บไว้ 20 ฉบับล่าสุด การเรียกคืนจะแทนที่แผนปัจจุบันทั้งหมด</div><div class="snaps">';
  if(SN.busy)h+='<div class="hint">กำลังโหลด…</div>';else if(SN.err)h+='<div class="hint">'+SN.err+'</div>';else if(!SN.list.length)h+='<div class="hint">ยังไม่มีฉบับที่บันทึก</div>';
  SN.list.forEach(s=>{const d=new Date(s.at);h+='<div class="snap"><span>Update '+esc(s.label||'')+(s.by?' · '+esc(s.by):'')+' · '+pad(d.getHours())+':'+pad(d.getMinutes())+' น. · '+(s.events||[]).length+' รายการ</span><button data-rs="'+esc(s.id)+'" class="'+(SN.arm===s.id?'danger':'')+'">'+(SN.arm===s.id?'ยืนยันเรียกคืน':'เรียกคืน')+'</button></div>'});
  h+='</div><div class="acts"><span class="sp"></span><button id="snClose">ปิด</button></div></div></div>';
  m.innerHTML=h;
  $('snClose').onclick=()=>{SN=null;drawSnaps()};
  $('snScrim').onclick=ev=>{if(ev.target.id==='snScrim'){SN=null;drawSnaps()}};
  m.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const id=b.dataset.rs;if(SN.arm!==id){SN.arm=id;drawSnaps();return}const s=SN.list.find(x=>x.id===id);SN=null;drawSnaps();await withLock(()=>restoreSnap(s,'restore'))});
}
async function restoreSnap(s,how){
  toast(how==='undo'?'กำลังยกเลิกการแก้ไข…':'กำลังเรียกคืน…',30000);setSaving(1);
  try{await api('restore',{id:s.id,how});S.dirty=false;clearHistory();await loadState();scheduleRender();
    toast(how==='undo'?'ยกเลิกการแก้ไขแล้ว แผนกลับไปเหมือนฉบับล่าสุด':'เรียกคืนฉบับ Update '+(s.label||'')+' แล้ว',5000)}
  catch(e){toast('ทำไม่สำเร็จ: '+((e&&e.message)||''),6000)}
  finally{setSaving(-1)}
}
function renderUndo(){renderRibbon()}
async function loadLastSnap(){
  try{const r=await api('lastSnap');if(r.snap)S.lastSnap=Object.assign({since:Math.max(r.snap.at||0,r.snap.undoneAt||0)},r.snap);S.dirty=!!r.dirty}catch(e){}
  renderUndo();
}
async function closeWork(){
  if(S.dirty||Q.length||Qp){await doSave();if(S.dirty)return}
  else toast('ไม่มีการเปลี่ยนแปลงหลังฉบับล่าสุด ออกจากโหมดแก้ไขแล้ว',4000);
  S.editing=false;S.armed=null;clearHistory();render();maybeRelease();
}

// ---------- access code (soft lock in this browser; who can open the page is set in Share) ----------
function unlockedUntil(){return TOKEN?TOKEN_EXP:0}
function showLock(on){$('lock').hidden=!on;$('app').hidden=on;if(on){setTimeout(()=>{const n=$('lockName'),i=$('lockIn');if(n)n.value=REC||'';if(i)i.value='';(n&&!n.value?n:i).focus()},30)}}
$('lockForm').addEventListener('submit',async ev=>{ev.preventDefault();const nm=$('lockName').value.trim();
  if(!nm){$('lockErr').textContent='กรุณาใส่ชื่อผู้ใช้งาน';$('lockName').focus();return}
  const btn=$('lockForm').querySelector('button');btn.disabled=true;$('lockErr').textContent='กำลังตรวจสอบ…';
  try{const r=await api('login',{name:nm,code:$('lockIn').value.trim()});
    TOKEN=r.token;TOKEN_EXP=r.exp;try{localStorage.setItem('mp_tok',JSON.stringify({token:TOKEN,exp:TOKEN_EXP}))}catch(e){}
    setRec(r.name||nm);$('lockErr').textContent='';showLock(false);startApp();}
  catch(e){$('lockErr').textContent=(e&&e.message)||'เข้าใช้งานไม่สำเร็จ';$('lockIn').select()}
  finally{btn.disabled=false}});
showLock(unlockedUntil()<Date.now()||!REC);
// session lasts 1 hour; 5 minutes before it ends, warn if there are edits not yet SAVEd
function tickSession(){
  if(S._lockShown!==!!lockOther()){S._lockShown=!!lockOther();render()}
  if(!$('lock').hidden)return;const left=unlockedUntil()-Date.now();
  if(left<=0){closePop();S.editing=false;clearHistory();PV=null;drawPV();draft=null;drawEditor();NF=null;drawNoteFmt();SN=null;drawSnaps();LG=null;drawLogs();$('expBar').hidden=true;showLock(true);toast('ครบ 1 ชั่วโมง กรุณาใส่รหัสใหม่');return}
  const warn=left<=5*60e3&&S.canWrite&&(S.dirty||!!draft||!!NF);
  $('expBar').hidden=!warn;
  if(warn){const m=Math.floor(left/60e3),sec=Math.floor(left%60e3/1e3);$('expTxt').textContent='อีก '+m+':'+pad(sec)+' นาทีหน้านี้จะล็อก ต้องใส่รหัสใหม่ · '+(draft||NF?'มีหน้าต่างแก้ไขที่ยังไม่กดบันทึก และ':'')+'มีการแก้ไขที่ยังไม่ได้ปิดงาน / ออกฉบับ'}
}
setInterval(tickSession,1000);
$('expSave').onclick=async()=>{if(draft&&isEd()){saveDraft()}if(NF){$('nfSave')&&$('nfSave').click()}await closeWork();tickSession()};

// ---------- data ----------
render();
let started=false;
async function startApp(){
  S.canWrite=true;S.uid=null;S._acct='';
  try{await loadState()}catch(e){if(e&&e.code!=='auth'){$('sheet').innerHTML='<div class="empty">'+esc((e&&e.message)||'โหลดแผนไม่สำเร็จ')+'</div>'}return}
  if(!started){started=true;joinRoom()}else pollOnce(true);
  loadLastSnap();
}
if(TOKEN&&REC&&TOKEN_EXP>Date.now())startApp();
})();
